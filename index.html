<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Login Interativo</title>
</head>
<body>
    <section class="containerPai">
        <div class="card loginActive">
            <div class="esquerda">
                <div class="formLogin">
                    <h2>Fazer Login</h2>
                    <form>
                        <input type="email" id="email" placeholder="E-mail">
                        <input type="password" id="password" placeholder="Senha">
                        <button onclick="fazerLogin()">Entrar</button>
                    </form>
                
                

                </div>
                <div class="façaLogin">
                    <h2>Já tem </br> uma conta?</h2>
                    <p>
                        Faça login para acessar serviços exclusivos, personalizar sua experiência e acompanhar suas atividades.
                    </p>
                    <button class="loginButton">Faça Login</button>
                </div>
            </div>
            <div class="direita">
                <div class="formCadastro">
                    <h2>Cadastro</h2>
                    <form>
                        <Input type="text" placeholder="Nome">
                        <Input type="email" placeholder="E-mail">
                        <Input type="password" placeholder="Senha">
                        <Input type="password" placeholder="Confirmar Senha">
                        <button type="submit">Cadastrar</button>
                    </form>
                </div>
                <div class="façaCadastro">
                    <h2>Não tem </br> uma conta?</h2>
                    <p>
                        Crie uma conta para acessar serviços exclusivos, personalizar sua experiência e acompanhar suas atividades.
                    </p>
                    <button class="cadastroButton">Cadastre-se</button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
